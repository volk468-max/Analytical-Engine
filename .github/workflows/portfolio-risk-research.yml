name: Portfolio research fixtures
on:
  pull_request:
    paths:
      - 'research/portfolio_risk_probability/**'
      - 'reports/portfolio-risk-probability-v1/**'
      - '.github/workflows/portfolio-risk-research.yml'
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s research/portfolio_risk_probability -v
