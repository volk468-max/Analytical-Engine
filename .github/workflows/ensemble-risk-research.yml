name: Ensemble risk research checks
on:
  pull_request:
    paths:
      - 'research/ensemble_risk_forecast/**'
      - 'reports/ensemble-risk-forecast-v1/**'
      - '.github/workflows/ensemble-risk-research.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/ensemble_risk_forecast/requirements.txt
      - run: python -m unittest discover -s research/ensemble_risk_forecast -v
        env:
          OPENBLAS_NUM_THREADS: '1'
