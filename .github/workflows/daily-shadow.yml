name: Daily shadow offline and isolated PostgreSQL tests
on:
  pull_request:
    paths:
      - 'research/daily_shadow/**'
      - 'research/daily_shadow_v3/**'
      - 'research/daily_shadow_live/**'
      - 'reports/daily-shadow-live-v4/**'
      - 'reports/daily-shadow-postgres-v3/**'
      - 'reports/daily-shadow-postgres-v2/**'
      - '.github/workflows/daily-shadow.yml'
permissions:
  contents: read
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: [16, 18]
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: alpha_shadow_research
          POSTGRES_PASSWORD: synthetic-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ALPHA_EXPECT_PG_MAJOR: ${{ matrix.postgres }}
      ALPHA_SHADOW_STAGE_DSN: host=127.0.0.1 port=5432 dbname=alpha_shadow_research user=alpha_shadow_test_app password=synthetic-local-only
      ALPHA_SHADOW_TEST_DSN: host=127.0.0.1 port=5432 dbname=alpha_shadow_research user=postgres password=synthetic-local-only
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install -r research/daily_shadow_v3/requirements.txt
      - name: Apply migration only to disposable local CI database
        run: |
          python -m research.daily_shadow_live.setup_fixture_db
      - name: Offline fixtures and actual PostgreSQL permission/concurrency checks
        run: python -m unittest research.daily_shadow.test_core research.daily_shadow.test_postgres research.daily_shadow.test_reporting research.daily_shadow.test_preparation -v
      - name: Research mode, legal gates and TTL tests
        run: python -m unittest research.daily_shadow_v3.test_unit research.daily_shadow_v3.test_postgres research.daily_shadow_live.test_live -v
      - name: Separate synthetic research rehearsal
        run: python -m research.daily_shadow_v3.rehearsal
      - name: Verify frozen model artifacts (network forbidden)
        run: python -m research.daily_shadow.verify_preparation
      - name: Supervised synthetic rehearsal on disposable database
        run: python -m research.daily_shadow.rehearsal
      - name: Backup and restore drill (disposable service databases only)
        env:
          CI_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          ALPHA_SHADOW_RESTORE_DSN: host=127.0.0.1 port=5432 dbname=alpha_shadow_restore user=alpha_shadow_test_app password=synthetic-local-only
        run: |
          docker exec "$CI_POSTGRES_CONTAINER" pg_dump -U postgres -d alpha_shadow_research -n alpha_shadow_v1 -n alpha_research_v3 -n alpha_licensed_v3 -n alpha_operations_v4 -Fc > "$RUNNER_TEMP/shadow.dump"
          docker exec "$CI_POSTGRES_CONTAINER" createdb -U postgres alpha_shadow_restore
          docker exec -i "$CI_POSTGRES_CONTAINER" pg_restore -U postgres -d alpha_shadow_restore --no-owner --exit-on-error < "$RUNNER_TEMP/shadow.dump"
          python -m research.daily_shadow.backup_restore
          python -m research.daily_shadow_v3.backup_restore
          python -m research.daily_shadow_live.backup_restore
  full-research-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r research/market_drawdown_precursors/requirements.txt -r requirements.txt
      - name: All seven parent research suites and root engine tests
        run: |
          python - <<'PY'
          import subprocess,sys
          for name in ('breadth_pit_qualification','ensemble_risk_forecast','eod_calibration_ledger','market_drawdown_precursors','model_portfolios_eod','portfolio_risk_probability','risk_forecast_validation'):
              subprocess.run([sys.executable,'-m','unittest','discover','-s','research/'+name,'-v'],check=True)
          PY
          python -m pytest tests/test_engines.py -q
      - name: Parent PR26 full preliminary replay (no network)
        run: python -m research.eod_calibration_ledger.verify_v2
