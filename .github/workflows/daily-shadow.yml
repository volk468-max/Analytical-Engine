name: Daily shadow offline and isolated PostgreSQL tests
on:
  pull_request:
    paths:
      - 'research/daily_shadow/**'
      - '.github/workflows/daily-shadow.yml'
permissions:
  contents: read
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: alpha_shadow_research
          POSTGRES_PASSWORD: synthetic-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ALPHA_SHADOW_TEST_DSN: host=127.0.0.1 port=5432 dbname=alpha_shadow_research user=postgres password=synthetic-local-only
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install -r research/daily_shadow/requirements.txt
      - name: Apply migration only to disposable local CI database
        run: |
          python - <<'PY'
          import os, pathlib, psycopg
          dsn=os.environ['ALPHA_SHADOW_TEST_DSN']
          info=psycopg.conninfo.conninfo_to_dict(dsn)
          assert info['host']=='127.0.0.1' and info['dbname']=='alpha_shadow_research'
          with psycopg.connect(dsn) as c:
              c.execute(pathlib.Path('research/daily_shadow/sql/001_isolated.sql').read_text())
          PY
      - name: Offline fixtures and actual PostgreSQL permission/concurrency checks
        run: python -m unittest research.daily_shadow.test_core research.daily_shadow.test_postgres research.daily_shadow.test_reporting -v
      - name: Synthetic demonstration (no network, no database)
        run: python -m research.daily_shadow.demo
