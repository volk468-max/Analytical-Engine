name: Market drawdown research checks
on:
  pull_request:
    paths:
      - 'research/market_drawdown_precursors/**'
      - 'reports/market-drawdown-precursors-v1/**'
      - '.github/workflows/market-drawdown-research.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/market_drawdown_precursors/requirements.txt
      - run: python -m unittest discover -s research/market_drawdown_precursors -v
        env:
          OPENBLAS_NUM_THREADS: '1'
