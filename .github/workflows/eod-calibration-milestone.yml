name: EOD calibration milestone
on:
  pull_request:
    paths:
      - 'research/eod_calibration_ledger/**'
      - 'reports/eod-calibration-ledger-v1/**'
      - 'reports/eod-calibration-ledger-v2/**'
      - '.github/workflows/eod-calibration-milestone.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install numpy==2.3.5 pandas==2.2.3 exchange-calendars==4.11.2
      - run: python -m unittest discover -s research/eod_calibration_ledger -v
      - name: Preliminary replay is offline and reproducible
        run: |
          python -m research.eod_calibration_ledger.verify_v2
